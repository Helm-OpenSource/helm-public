name: CI

# 语言 / Language: workflow job names intentionally remain English because
# branch protection required-check contexts depend on them.
# 中文说明：这是完整 CI 链。交付工程师提交 PR 时应先看失败 job，再回到本地运行
# 对应 npm 命令；不要把绿色 CI 解读为 release approval 或客户部署 ready。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Type check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint (strict — fails on any warning, including
          helm-design-tokens raw-color violations)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint:strict

  caio-overlay-composition-contract:
    name: CAIO Public-Overlay composition contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      # The EXACT Overlay commit this repository names. Read from the pin file
      # rather than written twice: a ref here that disagreed with the pin would
      # check out one tree and verify the SHA of another.
      - name: Read the pinned Overlay commit
        id: pin
        run: |
          echo "commit=$(node -p "require('./tools/caio-access-gateway/overlay-composition-pin.json').commit")" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Overlay
        uses: actions/checkout@v5
        with:
          repository: Helm-Developers/helm-overlays
          ref: ${{ steps.pin.outputs.commit }}
          path: .deps/helm-overlays

      # No checkout, a checkout at the wrong commit, or a composition that has
      # stopped mounting the real interface all fail here. The suite has no case
      # that can pass without the external tree.
      - name: Verify the composition contract
        run: npx vitest run --config vitest.overlay-contract.config.ts
        env:
          HELM_OVERLAYS_ROOT: .deps/helm-overlays

  repo-guards:
    name: Repo Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Self check
        run: npm run self-check

      - name: Boundary checks
        run: npm run check:boundaries

      - name: Doc frontmatter guard
        run: npx tsx scripts/check-doc-frontmatter.ts

      - name: Bilingual mixing guard
        run: npm run check:bilingual-mixing

      - name: Public release guard
        run: npm run check:public-release

      - name: Public commit metadata guard (PR baseline)
        if: github.event_name == 'pull_request'
        env:
          HELM_PUBLIC_COMMIT_METADATA_BASELINE_REF: origin/${{ github.base_ref }}
        run: npm run check:public-commit-metadata

      - name: Public commit metadata guard (push baseline)
        if: github.event_name != 'pull_request'
        env:
          HELM_PUBLIC_COMMIT_METADATA_BASELINE_REF: HEAD^
        run: npm run check:public-commit-metadata

      - name: Secret history guard (PR baseline)
        if: github.event_name == 'pull_request'
        env:
          HELM_SECRET_HISTORY_BASELINE_REF: origin/${{ github.base_ref }}
        run: npm run check:secret-history

      - name: Secret history guard (push baseline)
        if: github.event_name != 'pull_request'
        env:
          # origin/main still carries the documented 2026-04-27 remediation debt.
          # Push CI should reject new listed compromised commits while keeping the
          # full no-baseline release check available for controlled remediation.
          HELM_SECRET_HISTORY_BASELINE_REF: HEAD^
        run: npm run check:secret-history

  validate-env:
    name: Validate Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Create example .env file
        run: cp .env.example .env

      - name: Validate environment
        run: npm run validate:env
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, lint, repo-guards, model-egress-mysql,
            caio-access-gateway-mysql, caio-context-memory-mysql,
            caio-audit-state-mysql]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: .next/
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [type-check, lint, repo-guards, model-egress-mysql,
            caio-access-gateway-mysql, caio-context-memory-mysql,
            caio-audit-state-mysql]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Create example .env file
        run: cp .env.example .env

      - name: Run unit tests
        run: npm run test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7

  # 中文说明：下面所有 MySQL job 都不提交数据库口令。service 容器以空口令 root
  # 启动（只在 runner 本机 127.0.0.1 暴露），job 第一步在容器内生成随机口令，
  # 先用 ::add-mask:: 注册再使用，建立只对本 job 隔离库有权限的最小权限用户，
  # 并立刻把 root 换成随机口令关闭引导窗口。此后所有连接串只用最小权限用户，
  # 经 $GITHUB_ENV 注入，不出现在 YAML 字面量、不出现在任何命令行参数里。
  # English: the MySQL jobs below commit no database credential. Passwords are
  # generated per job at runtime, masked before first use, and injected through
  # the protected $GITHUB_ENV file. Tests never connect as root.
  caio-stage1-mysql:
    name: CAIO Stage1 MySQL
    runs-on: ubuntu-latest
    needs: [type-check, repo-guards]
    services:
      mysql:
        image: mysql:8.4
        env:
          # No database password is committed. The container boots with an
          # empty root password on the runner loopback only; the first job
          # step below mints a random least-privilege credential and rotates
          # root to a random password before anything connects for real.
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: helm_caio_stage1_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      HELM_CI_MYSQL_DATABASE: helm_caio_stage1_ci
      HELM_CI_MYSQL_USER: helm_ci
      STAGE1_OWNER_LOOP_TEST_DATABASE_NAME: helm_caio_stage1_ci
      CAIO_INITIALIZATION_GATE_TEST_DATABASE_NAME: helm_caio_stage1_ci
    steps:
      - uses: actions/checkout@v5

      - name: Mint an isolated least-privilege MySQL credential
        env:
          HELM_CI_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          app_password="$(openssl rand -hex 24)"
          root_password="$(openssl rand -hex 24)"
          echo "::add-mask::${app_password}"
          echo "::add-mask::${root_password}"
          bootstrap_sql="$(mktemp)"
          chmod 600 "${bootstrap_sql}"
          {
            printf "CREATE USER IF NOT EXISTS '%s'@'%%' IDENTIFIED BY '%s';\n" \
              "${HELM_CI_MYSQL_USER}" "${app_password}"
            printf "GRANT ALL PRIVILEGES ON \`%s\`.* TO '%s'@'%%';\n" \
              "${HELM_CI_MYSQL_DATABASE}" "${HELM_CI_MYSQL_USER}"
            # Migrations create append-only triggers, which the server refuses
            # under binary logging from a user without SUPER (error 1419).
            # Measured on the pinned mysql:8.4 image: SET_USER_ID no longer
            # exists (granting it is a syntax error) and SET_ANY_DEFINER, its
            # replacement, does NOT satisfy this particular check. So the root
            # bootstrap trusts creators for this container instead, and the
            # application user stays scoped to its own database.
            #
            # This is safe HERE and nowhere else: the container is ephemeral,
            # loopback-only, and has exactly one non-root user. Do not copy this
            # line to a server that outlives a job or serves anyone else.
            printf "SET GLOBAL log_bin_trust_function_creators = 1;\n"
            printf "ALTER USER IF EXISTS 'root'@'%%' IDENTIFIED BY '%s';\n" \
              "${root_password}"
            printf "ALTER USER IF EXISTS 'root'@'localhost' IDENTIFIED BY '%s';\n" \
              "${root_password}"
            printf "FLUSH PRIVILEGES;\n"
          } >"${bootstrap_sql}"
          docker exec -i "${HELM_CI_MYSQL_CONTAINER}" \
            mysql --host=127.0.0.1 --protocol=tcp --user=root --batch \
            <"${bootstrap_sql}"
          rm -f "${bootstrap_sql}"
          credential="${HELM_CI_MYSQL_USER}:${app_password}"
          url="mysql://${credential}@127.0.0.1:3306/${HELM_CI_MYSQL_DATABASE}?charset=utf8mb4"
          {
            printf 'DATABASE_URL=%s\n' "${url}"
            printf 'STAGE1_OWNER_LOOP_DATABASE_URL=%s\n' "${url}"
            printf 'CAIO_INITIALIZATION_GATE_DATABASE_URL=%s\n' "${url}"
          } >>"${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Replay migrations on an empty database
        run: npx tsx prisma/setup-db.ts prepare

      - name: Verify Stage1 + CAIO G0 governance against MySQL
        run: npm run test:caio-stage1:mysql

