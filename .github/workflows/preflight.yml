name: Preflight (Fast PR Feedback)

# 语言 / Language: workflow job names intentionally remain English because
# branch protection required-check contexts depend on them.
# 中文说明：这是快速 PR feedback 链，只跑 lint / typecheck / boundary 等轻量 gate。
# 交付工程师可用它快速判断 PR 是否值得进入完整 CI review。
#
# Lightweight CI that runs the fast static gates (lint / typecheck / boundary
# plus three small guards) for quick PR reviewer feedback. Heavier checks
# (build / test / e2e / quality regression) continue to run in ci.yml.
#
# MEASURED runtime, not a promise: 7m45s on 2026-07-30 (run 30542171638) —
# lint:strict 4m42s, typecheck 58s, boundary 1m07s, guards ~20s. That is still
# roughly half of the full ci.yml chain, which is the point of this workflow.
#
# TIMEOUT BUDGET: the limit must clear the measured runtime with real headroom.
# It previously sat at 8 minutes against a 7m45s run — 15 seconds of margin, so
# one slow `npm ci` or a cold cache turned a clean branch into a FAILED required
# check. scripts/preflight-workflow-budget.test.ts pins the headroom rule.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-flight preflight runs when a new push lands; full ci.yml stays.
concurrency:
  group: preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Lint + Typecheck + Boundary
    runs-on: ubuntu-latest
    # ~2x the measured 7m45s runtime; see the TIMEOUT BUDGET note above.
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint (strict)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint:strict

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: Boundary checks
        run: npm run check:boundaries

      - name: Public release guard
        run: npm run check:public-release

      - name: Doc frontmatter guard
        run: npx tsx scripts/check-doc-frontmatter.ts

      - name: Bilingual mixing guard
        run: npm run check:bilingual-mixing
